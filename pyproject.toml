[project]
name = "etims-integrator"
version = "0.1.0"
description = "KRA eTIMS VSCU system-to-system integrator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "pydantic==2.13.5",
    "python-dotenv==1.2.3",
    "uvicorn==0.52.4",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "flake8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
